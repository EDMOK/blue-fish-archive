name: Validate sticker manifest

on:
  pull_request:
    paths:
      - "media/**"
      - "stickers/manifest.json"
      - "scripts/sync_stickers.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate sticker manifest
        run: python scripts/sync_stickers.py --check
