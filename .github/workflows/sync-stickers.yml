name: Sync sticker manifest

on:
  push:
    branches:
      - main
      - master
    paths:
      - "表情包/**"
      - "scripts/sync_stickers.py"
      - ".github/workflows/sync-stickers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate manifest
        run: python scripts/sync_stickers.py

      - name: Commit updated manifest
        run: |
          if git diff --quiet -- stickers/manifest.json; then
            echo "Manifest is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stickers/manifest.json
          git commit -m "chore: sync sticker manifest"
          git push
